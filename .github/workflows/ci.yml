name: Synthetic checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality, PostgreSQL and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      # Public fixture password for this disposable service only.
      TEST_DATABASE_URL: postgres://postgres:synthetic-test-only@127.0.0.1:5432/contacts
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: contacts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contacts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format, lint, build and synthetic integration tests
        run: npm run check
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:ui
